name: Runner e2e (Windows, Linux, macOS)

# The real runner on a real Windows, Linux and macOS machine, connected to a real runner-hub (deploy/aidev/auth-gateway):
# shells (cmd / PowerShell / Git Bash / sh / bash) with UTF-8 and exit codes, a stop ending the whole process tree,
# fs.pull, adb from the SDK folder, capabilities — test/runner-parity-e2e-test.mjs — plus the Windows-only cargo tests
# (`win_`), and `install` / `uninstall` with their defaults (from boot, administrator rights) and restrictions.
# Runs on pushes that touch the runner or its gateway side, and by hand (Actions → Run workflow).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/aidev/runner/**'
      - 'deploy/aidev/auth-gateway/src/runner-hub.ts'
      - 'deploy/aidev/auth-gateway/src/remote-gate.ts'
      - 'deploy/aidev/auth-gateway/test/runner-parity-e2e-test.mjs'
      - '.github/workflows/runner-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_DIR: deploy/aidev/runner
  GATEWAY_DIR: deploy/aidev/auth-gateway
  CARGO_TERM_COLOR: never

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm
      # the ScreenCaptureKit/Metal Swift bridges (F-18) need the macOS 15 SDK: the newest Xcode on the image
      - name: Newest Xcode
        if: runner.os == 'macOS'
        run: |
          x=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$x"; xcodebuild -version | head -1; xcrun --sdk macosx --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUNNER_DIR }}
          key: e2e
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: cargo build
        working-directory: ${{ env.RUNNER_DIR }}
        run: cargo build --release --locked
      - name: cargo test (Windows-only checks)
        if: runner.os == 'Windows'
        working-directory: ${{ env.RUNNER_DIR }}
        run: cargo test --release --locked win_ -- --nocapture
      # F-18: the remote screen's capture and encoders on this machine (Windows: Graphics Capture; macOS 13+:
      # ScreenCaptureKit needs a Screen Recording grant CI does not have — the CPU path is timed there)
      - name: remote screen bench
        if: runner.os == 'Windows'
        working-directory: ${{ env.RUNNER_DIR }}
        shell: pwsh
        run: |
          $out = (& target\release\aidev-runner.exe bench --frames 30 2>&1 | Out-String); $out
          if ($out -notmatch 'Windows Graphics Capture \(\d+') { throw 'Windows Graphics Capture gave no picture' }
      - name: remote screen bench (Linux, X11 MIT-SHM)
        if: runner.os == 'Linux'
        working-directory: ${{ env.RUNNER_DIR }}
        run: |
          sudo apt-get install -y -q xvfb >/dev/null
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 & sleep 1
          out=$(DISPLAY=:99 target/release/aidev-runner bench --frames 30 2>&1); echo "$out"
          echo "$out" | grep -q '캡처 MIT-SHM' || { echo 'MIT-SHM was not used'; exit 1; }
          kill %1
      - name: cargo test (all)
        if: runner.os != 'Windows'
        working-directory: ${{ env.RUNNER_DIR }}
        run: cargo test --release --locked

      - name: gateway build
        if: ${{ !cancelled() }}
        working-directory: ${{ env.GATEWAY_DIR }}
        run: npm ci --no-audit --no-fund && npm run build
      - name: remote gate rules
        if: ${{ !cancelled() }}
        working-directory: ${{ env.GATEWAY_DIR }}
        run: node test/remote-gate-test.mjs
      - name: runner parity e2e
        if: ${{ !cancelled() }}
        working-directory: ${{ env.GATEWAY_DIR }}
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/$RUNNER_DIR/target/release/aidev-runner"
          [ "$RUNNER_OS" = Windows ] && bin="$bin.exe"
          RUNNER_BIN="$bin" node test/runner-parity-e2e-test.mjs

      # install's default on Linux / macOS: from boot (linger / a LaunchDaemon) and passwordless sudo — GitHub's machines
      # already have passwordless sudo, so the steps that ask for the password on a real PC run here unattended
      - name: install / uninstall (Linux, macOS)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/$RUNNER_DIR/target/release/aidev-runner"
          mkdir -p ~/.aidev "$RUNNER_TEMP/work"
          printf 'gateway = "http://127.0.0.1:9"\ntoken = "x"\ntarget_id = 1\nname = "ci"\nallowed_roots = ["%s"]\n' "$RUNNER_TEMP/work" > ~/.aidev/runner.toml
          log=~/.aidev/runner.log
          waitfor() { for i in $(seq 1 40); do if eval "$2"; then echo "ok: $1"; return 0; fi; sleep 1; done; tail -20 "$log" 2>/dev/null || true; echo "timed out: $1"; exit 1; }
          # installed from a downloaded file, which is deleted afterwards: the service runs ~/.aidev/bin/aidev-runner
          mkdir -p "$RUNNER_TEMP/Downloads"; cp "$bin" "$RUNNER_TEMP/Downloads/aidev-runner"
          "$RUNNER_TEMP/Downloads/aidev-runner" install
          rm "$RUNNER_TEMP/Downloads/aidev-runner"
          test -x ~/.aidev/bin/aidev-runner && echo "ok: copied to ~/.aidev/bin, the download is gone"
          bin=~/.aidev/bin/aidev-runner
          # /etc/sudoers.d is root-only on Ubuntu: look with sudo
          sudo grep -q "^$USER ALL=(ALL) NOPASSWD: ALL" /etc/sudoers.d/aidev-runner
          echo "ok: passwordless sudo for $USER"
          if [ "$RUNNER_OS" = Linux ]; then
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            [ "$(loginctl show-user "$USER" -p Linger --value)" = yes ] && echo "ok: linger (runs from boot)"
            grep -q "ExecStart=\"$HOME/.aidev/bin/aidev-runner\" start --service --boot" ~/.config/systemd/user/aidev-runner.service && echo "ok: the unit runs the installed copy"
            grep -q 'start --service --boot' ~/.config/systemd/user/aidev-runner.service && grep -q 'Restart=on-failure' ~/.config/systemd/user/aidev-runner.service
            grep -q 'start --service --log' ~/.config/autostart/aidev-runner.desktop && echo "ok: autostart entry for desktop logins"
            waitfor 'the user service runs' 'systemctl --user is-active --quiet aidev-runner'
            waitfor 'the boot runner (systemd) holds the connection' 'grep -q "부팅 러너: 연결을 맡습니다" "$log"'
            # a desktop login: the autostart entry's runner (with the session's DISPLAY) takes over, and gives it back
            DISPLAY=:99 "$bin" start --service --log "$RUNNER_TEMP/session.log" & session=$!
            waitfor 'the session runner took the connection' 'grep -q "연결을 넘깁니다" "$log"'
            sleep 2; kill -0 $session && echo "ok: the session runner holds the connection"
            kill $session; wait $session 2>/dev/null || true
            waitfor 'the boot runner takes over when the session ends' '[ "$(grep -c "부팅 러너: 연결을 맡습니다" "$log")" -ge 2 ]'
            # 정지 / 종료 semantics: exit 0 is not restarted
            touch ~/.aidev/paused; sleep 3
            systemctl --user is-active --quiet aidev-runner && echo "ok: paused, still running (the icon stays)"
            rm -f ~/.aidev/paused
          else
            launchctl print "gui/$(id -u)/work.nado.aidev-runner" >/dev/null && echo "ok: LaunchAgent"
            sudo launchctl print system/work.nado.aidev-runner-boot >/dev/null && echo "ok: LaunchDaemon (from boot, as $USER)"
            grep -q '<string>--boot</string>' /Library/LaunchDaemons/work.nado.aidev-runner-boot.plist
            grep -q "<string>$HOME/.aidev/bin/aidev-runner</string>" ~/Library/LaunchAgents/work.nado.aidev-runner.plist && echo "ok: the LaunchAgent runs the installed copy"
            # the session's runner and the boot runner: one holds the connection, the other waits or has handed over
            waitfor 'two runners: the session one and the boot one' '[ "$(pgrep -f "aidev-runner start" | wc -l | tr -d " ")" -ge 2 ]'
            waitfor 'the boot runner handed over to the session runner' 'grep -q "연결을 넘깁니다" "$log" || ! grep -q "부팅 러너: 연결을 맡습니다" "$log"'
          fi
          # this Mac's stable signature (Screen Recording kept across updates): say why if it cannot be made here
          if [ "$RUNNER_OS" = macOS ]; then cp "$bin" "$RUNNER_TEMP/sign-probe"; bash -x "$GITHUB_WORKSPACE/$RUNNER_DIR/scripts/sign-macos.sh" "$RUNNER_TEMP/sign-probe" 2>&1 | tail -15 || true; fi
          # on the PATH: the shell start files, and /usr/local/bin (passwordless sudo after the default install)
          # -q: a match is success even though some of these files do not exist
          grep -qsF 'export PATH="$HOME/.aidev/bin:$PATH"' ~/.zshrc ~/.bashrc ~/.bash_profile ~/.profile
          echo "ok: PATH line in the shell start files"
          [ "$(readlink /usr/local/bin/aidev-runner)" = "$HOME/.aidev/bin/aidev-runner" ] && echo "ok: /usr/local/bin/aidev-runner"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/local/bin bash -c 'command -v aidev-runner' >/dev/null && echo "ok: aidev-runner from any shell"
          # update (`aidev-runner update`, the icon's 업데이트): the runners stop, the file is replaced, each starts again
          # from it — the service's own process (same pid), sudo and the registrations unchanged
          ver=$("$bin" --version | awk '{print $2}')
          srv="$RUNNER_TEMP/srv"; mkdir -p "$srv/_runner"; cp "$GITHUB_WORKSPACE/$RUNNER_DIR/target/release/aidev-runner" "$srv/runner-bin"
          sha=$( (sha256sum "$srv/runner-bin" 2>/dev/null || shasum -a 256 "$srv/runner-bin") | awk '{print $1}')
          printf '{"latest":"%s","versions":[{"version":"%s","url":"/runner-bin","sha256":"%s","date":null}]}' "$ver" "$ver" "$sha" > "$srv/_runner/versions"
          # a static server for the version list and the file (node: python3's http.server timed out on macos-15)
          node -e "const h=require('http'),f=require('fs'),p=require('path');h.createServer((q,r)=>{const u=p.join(process.argv[1],decodeURIComponent(q.url.split('?')[0]));f.readFile(u,(e,d)=>{if(e){r.writeHead(404);return r.end()}r.end(d)})}).listen(8765,'127.0.0.1')" "$srv" & http=$!
          sleep 2
          if [ "$RUNNER_OS" = Linux ]; then pid_before=$(systemctl --user show -p MainPID --value aidev-runner); else pid_before=$(launchctl print "gui/$(id -u)/work.nado.aidev-runner" | awk '/^\tpid =/ {print $3}'); fi
          before=$(grep -c "새 러너로 다시 시작합니다" "$log" || true); holds=$(grep -c "부팅 러너: 연결을 맡습니다" "$log" || true)
          "$bin" update --gateway http://127.0.0.1:8765 < /dev/null | tee "$RUNNER_TEMP/list.out"
          grep -q "$ver (최신, 현재)" "$RUNNER_TEMP/list.out" && echo "ok: the version list"
          "$bin" update "$ver" --gateway http://127.0.0.1:8765 | tee "$RUNNER_TEMP/update.out"
          grep -q "설치 완료" "$RUNNER_TEMP/update.out"
          test -x ~/.aidev/bin/aidev-runner.prev && echo "ok: the previous file kept"
          want=$([ "$RUNNER_OS" = macOS ] && echo 2 || echo 1)
          waitfor "$want runner(s) started again from the new file" '[ "$(grep -c "새 러너로 다시 시작합니다" "$log")" -ge $((before + want)) ]'
          if [ "$RUNNER_OS" = Linux ]; then
            pid_after=$(systemctl --user show -p MainPID --value aidev-runner)
            waitfor 'the boot runner holds the connection again' '[ "$(grep -c "부팅 러너: 연결을 맡습니다" "$log")" -gt $holds ]'
          else
            pid_after=$(launchctl print "gui/$(id -u)/work.nado.aidev-runner" | awk '/^\tpid =/ {print $3}')
            sudo launchctl print system/work.nado.aidev-runner-boot >/dev/null
          fi
          [ -n "$pid_before" ] && [ "$pid_before" = "$pid_after" ] && echo "ok: the service's own process, updated in place (pid $pid_after)"
          sudo grep -q "^$USER ALL=(ALL) NOPASSWD: ALL" /etc/sudoers.d/aidev-runner && echo "ok: sudo kept"
          test ! -e ~/.aidev/updating
          kill $http 2>/dev/null || true
          "$bin" install --limited --logon-only
          sudo test ! -e /etc/sudoers.d/aidev-runner
          echo "ok: --limited removed the sudo rule"
          if [ "$RUNNER_OS" = macOS ]; then test ! -e /Library/LaunchDaemons/work.nado.aidev-runner-boot.plist && echo "ok: --logon-only removed the LaunchDaemon"; fi
          "$bin" install
          "$bin" uninstall
          sudo test ! -e /etc/sudoers.d/aidev-runner
          if [ "$RUNNER_OS" = Linux ]; then ! systemctl --user is-active --quiet aidev-runner && test ! -e ~/.config/systemd/user/aidev-runner.service; fi
          if [ "$RUNNER_OS" = macOS ]; then ! launchctl print "gui/$(id -u)/work.nado.aidev-runner" >/dev/null 2>&1 && test ! -e /Library/LaunchDaemons/work.nado.aidev-runner-boot.plist; fi
          sleep 2; ! pgrep -f 'aidev-runner start' && echo "ok: uninstall removed everything and stopped the runners"

      # install's default (what WinRM gives an administrator): elevated, from boot — a boot task (S4U) holds the
      # connection before a sign-in and hands it to the sign-in's runner; --limited --logon-only restrict it
      - name: install / uninstall (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        # pwsh: reads the step script as UTF-8 (the log checks match Korean text; Windows PowerShell would read ANSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$env:GITHUB_WORKSPACE\$env:RUNNER_DIR\target\release\aidev-runner.exe"
          # the tasks run without this step's environment: the config sits where a real install keeps it
          $cfgDir = "$env:USERPROFILE\.aidev"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          Set-Content "$cfgDir\runner.toml" "gateway = `"http://127.0.0.1:9`"`ntoken = `"x`"`ntarget_id = 1`nname = `"ci`"`nallowed_roots = ['$env:RUNNER_TEMP']" -Encoding utf8
          $log = "$cfgDir\runner.log"
          function LogHas($re) { (Test-Path $log) -and ((Get-Content $log -Encoding utf8 -Raw) -match $re) }
          # the boot runner holds the connection when its last word was "맡습니다" (not "넘깁니다")
          function BootHolds { if (-not (Test-Path $log)) { return $false }; $m = [regex]::Matches((Get-Content $log -Encoding utf8 -Raw), '연결을 (맡습니다|넘깁니다)'); $m.Count -gt 0 -and $m[$m.Count - 1].Groups[1].Value -eq '맡습니다' }
          function WaitFor($what, $test) { for ($i = 0; $i -lt 40 -and -not (& $test); $i++) { Start-Sleep 1 }; if (-not (& $test)) { if (Test-Path $log) { Get-Content $log -Encoding utf8 -Tail 15 }; throw "timed out: $what" }; "ok: $what" }

          # no command: the runner runs in the foreground (what a double-click does)
          $fg = Start-Process $bin -PassThru -WindowStyle Hidden
          Start-Sleep 3
          if ($fg.HasExited) { throw "bare aidev-runner exited ($($fg.ExitCode))" }
          Stop-Process -Id $fg.Id -Force
          'bare aidev-runner runs in the foreground'

          # installed from a downloaded file, which is deleted afterwards: the tasks run %USERPROFILE%\.aidev\bin\aidev-runner.exe
          $dl = "$env:RUNNER_TEMP\Downloads"; New-Item -ItemType Directory -Force $dl | Out-Null; Copy-Item $bin "$dl\aidev-runner.exe"
          & "$dl\aidev-runner.exe" install
          if ($LASTEXITCODE) { throw "install exit $LASTEXITCODE" }
          Remove-Item "$dl\aidev-runner.exe"
          $bin = "$cfgDir\bin\aidev-runner.exe"
          if (-not (Test-Path $bin)) { throw 'not copied to .aidev\bin' }
          if ((Get-ScheduledTask -TaskName aidev-runner).Actions[0].Execute -ne $bin) { throw "the task runs $((Get-ScheduledTask -TaskName aidev-runner).Actions[0].Execute)" }
          'ok: copied to .aidev\bin, the download is gone, the tasks run the installed copy'
          $logon = Get-ScheduledTask -TaskName aidev-runner; $boot = Get-ScheduledTask -TaskName aidev-runner-boot
          "logon: RunLevel=$($logon.Principal.RunLevel) LogonType=$($logon.Principal.LogonType) Trigger=$($logon.Triggers[0].CimClass.CimClassName) Limit=$($logon.Settings.ExecutionTimeLimit)"
          "boot:  RunLevel=$($boot.Principal.RunLevel) LogonType=$($boot.Principal.LogonType) Trigger=$($boot.Triggers[0].CimClass.CimClassName) Limit=$($boot.Settings.ExecutionTimeLimit)"
          if ($logon.Principal.RunLevel -ne 'Highest' -or $boot.Principal.RunLevel -ne 'Highest') { throw 'not elevated by default' }
          if ($boot.Principal.LogonType -ne 'S4U' -or $boot.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskBootTrigger') { throw 'no boot start by default' }
          if ($logon.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') { throw 'no sign-in task' }
          if ($logon.Settings.ExecutionTimeLimit -ne 'PT0S' -or $boot.Settings.ExecutionTimeLimit -ne 'PT0S') { throw 'a task would stop after a time limit' }
          WaitFor 'the sign-in task took the connection from the boot runner' { LogHas '연결을 넘깁니다' }
          # here the sign-in task runs in this very session: end it, and the boot runner takes the connection back
          Stop-ScheduledTask -TaskName aidev-runner
          WaitFor 'the boot runner takes over when the session runner ends' { BootHolds }
          # a session runner started by hand takes it again, and gives it back when it ends
          $session = Start-Process $bin -ArgumentList 'start','--log',"$env:RUNNER_TEMP\session.log" -PassThru -WindowStyle Hidden
          WaitFor 'the boot runner hands over' { -not (BootHolds) }
          Start-Sleep 3
          if ($session.HasExited) { Get-Content "$env:RUNNER_TEMP\session.log" -Tail 5; throw 'the session runner did not get the connection' }
          'the session runner holds the connection'
          Stop-Process -Id $session.Id -Force
          WaitFor 'the boot runner takes over again' { BootHolds }

          # on the user's Path (registry, REG_EXPAND_SZ kept)
          $envKey = (Get-Item 'HKCU:\').OpenSubKey('Environment')
          $userPath = [string]$envKey.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (-not (($userPath -split ';') -contains "$cfgDir\bin")) { throw "not on the user's Path: $userPath" }
          if ($envKey.GetValueKind('Path') -ne 'ExpandString') { throw 'the Path lost its REG_EXPAND_SZ type' }
          'ok: on the user''s Path'
          # update: the runners stop, the file is replaced (a running .exe is renamed aside), each starts again from it
          # with its own arguments and token; the tasks are unchanged
          $ver = ((& $bin --version) -split ' ')[1]
          $srv = "$env:RUNNER_TEMP\srv"; New-Item -ItemType Directory -Force "$srv\_runner" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\$env:RUNNER_DIR\target\release\aidev-runner.exe" "$srv\runner-bin"
          $sha = (Get-FileHash "$srv\runner-bin" -Algorithm SHA256).Hash.ToLower()
          Set-Content "$srv\_runner\versions" ('{"latest":"' + $ver + '","versions":[{"version":"' + $ver + '","url":"/runner-bin","sha256":"' + $sha + '","date":null}]}') -NoNewline -Encoding ascii
          $http = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WorkingDirectory $srv -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $restarts = { ([regex]::Matches((Get-Content $log -Encoding utf8 -Raw), '새 러너로 다시 시작합니다')).Count }
          $before = & $restarts
          $list = (& $bin update --gateway http://127.0.0.1:8765 | Out-String); $list
          if ($list -notmatch [regex]::Escape("$ver (최신, 현재)")) { throw 'the version list' }
          & $bin update $ver --gateway http://127.0.0.1:8765
          if ($LASTEXITCODE) { throw "update exit $LASTEXITCODE" }
          if (-not (Test-Path "$cfgDir\bin\aidev-runner.prev.exe")) { throw 'the previous file was not kept' }
          WaitFor 'the boot runner started again from the new file' { (& $restarts) -gt $before }
          Start-Sleep 5
          WaitFor 'the restarted runner holds the connection' { BootHolds }
          $running = @(Get-CimInstance Win32_Process -Filter "Name='aidev-runner.exe'" | Where-Object { $_.CommandLine -match ' start( |$)' })
          if ($running.Count -lt 1) { throw 'no runner after the update' }
          "runners after the update: $($running.Count) ($($running.CommandLine -join ' | '))"
          if ((Get-ScheduledTask -TaskName aidev-runner).Principal.RunLevel -ne 'Highest' -or (Get-ScheduledTask -TaskName aidev-runner-boot).Actions[0].Execute -ne $bin) { throw 'the tasks changed' }
          if (Test-Path "$cfgDir\updating") { throw 'the update file was left behind' }
          Stop-Process -Id $http.Id -Force
          'ok: update kept the tasks and restarted the runners'

          & $bin uninstall
          if (Get-ScheduledTask -TaskName 'aidev-runner*' -ErrorAction SilentlyContinue) { throw 'uninstall left a task' }
          Start-Sleep 2
          if (Get-Process aidev-runner -ErrorAction SilentlyContinue) { throw 'uninstall left a runner running' }
          'uninstall removed both tasks and their runners'

          & $bin install --limited --logon-only
          $t = Get-ScheduledTask -TaskName aidev-runner
          if ($t.Principal.RunLevel -ne 'Limited' -or (Get-ScheduledTask -TaskName aidev-runner-boot -ErrorAction SilentlyContinue)) { throw '--limited --logon-only' }
          & $bin install-service --limited   # the old name still works
          & $bin uninstall
          'restricted install ok'
