name: aidev

# No service here is built from source. Application code for the gateway, the
# runtime-manager and every CloudCLI runtime lives in the shared `app` volume as
# releases/<sha>/ behind a `current` symlink (deploy/aidev/release/release.sh).
# An update = install a release, swap the symlink, restart processes. Images are
# plain node:22 (control plane) or the tools-only aidev/cloudcli-runtime image.

x-node: &node
  image: node:22-bookworm-slim
  user: "1001:1001"
  working_dir: /srv/app/current
  restart: unless-stopped

services:
  auth-gateway:
    <<: *node
    container_name: aidev-auth-gateway
    command: ["node", "/srv/app/current/control/gateway/dist/auth-gateway.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_ORIGIN: https://dev.nado.work
      # F-18: the same gateway at an address that skips Cloudflare (docs/aidev/CONNECTIVITY.md), e.g.
      # https://rt.nado.work:8443 — empty: off. Runners and remote screens try it first and fall back by themselves.
      REALTIME_ORIGIN: ${AIDEV_REALTIME_ORIGIN:-}
      DATABASE_PATH: /data/auth.db
      JWT_SECRET_FILE: /run/secrets/gateway-jwt
      RUNTIME_MANAGER_URL: http://runtime-manager:8090
      RUNTIME_MANAGER_TOKEN_FILE: /run/secrets/runtime-token
      STATIC_ROOT: /srv/app/current/dist
      AIDEV_RELEASE_FILE: /srv/app/current/RELEASE
      LAYA_URL: http://laya:8095
    secrets:
      - gateway-jwt
      - runtime-token
    volumes:
      - auth-data:/data
      - app:/srv/app:ro
    networks:
      - npm-net
      - control-net
    depends_on:
      runtime-manager:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/_gateway/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  runtime-manager:
    <<: *node
    container_name: aidev-runtime-manager
    # Docker Engine access is the only privileged capability in the stack; the socket is
    # owned by root, so this service runs as root while the gateway and runtimes do not.
    user: "0:0"
    command: ["node", "/srv/app/current/control/runtime-manager/dist/runtime-manager.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      RUNTIME_MANAGER_TOKEN_FILE: /run/secrets/runtime-token
      DOCKER_SOCKET: /var/run/docker.sock
      CLOUDCLI_IMAGE: ${AIDEV_RUNTIME_IMAGE:-aidev/cloudcli-runtime:latest}
      APP_VOLUME: aidev_app
      RUNTIME_KEYS_DIR: /runtime-keys
      HOST_RUNTIME_KEYS_DIR: /home/turtlelab/aidev/runtime-keys
      MANAGER_CONTAINER: aidev-runtime-manager
    secrets:
      - runtime-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/turtlelab/aidev/runtime-keys:/runtime-keys
      - app:/srv/app:ro
    networks:
      - control-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  laya:
    container_name: aidev-laya
    image: ${AIDEV_LAYA_IMAGE:-aidev/laya-runtime:latest}
    user: "1001:1001"
    group_add: ["44", "993"]          # video, render on the AI-PC -> /dev/dri, /dev/kfd
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined            # ROCm/HSA needs a few syscalls the default profile blocks
    environment:
      PORT: 8095
      LAYA_MODEL: ${LAYA_MODEL:-convaiinnovations/laya-multilingual}
      LAYA_DEVICE: ${LAYA_DEVICE:-auto}
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"             # weights are pre-fetched into the models volume (laya-image.sh models)
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-11.5.0}   # gfx1150 (Radeon 890M); an empty value breaks HSA device enumeration
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"                        # fused SDPA attention on RDNA3.5 (torch warns it is experimental)
    volumes:
      - app:/srv/app:ro
      - models:/models
    networks:
      - control-net
    restart: unless-stopped

volumes:
  auth-data:
  app:
    name: aidev_app
  models:
    name: aidev_models

secrets:
  gateway-jwt:
    file: ${AIDEV_SECRET_DIR:-./secrets}/gateway-jwt
  runtime-token:
    file: ${AIDEV_SECRET_DIR:-./secrets}/runtime-token

networks:
  npm-net:
    name: ${AIDEV_PROXY_NETWORK:-proxy-net}
    external: true
  control-net:
    name: aidev-control-net
    internal: true
