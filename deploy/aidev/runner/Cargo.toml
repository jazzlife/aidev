[package]
name = "aidev-runner"
version = "0.4.0"
edition = "2021"
description = "Nado AI Dev remote runner: connects a developer PC to the platform (outbound only) to run, sync, preview, show and debug code"
license = "UNLICENSED"
publish = false

[[bin]]
name = "aidev-runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "signal", "io-util", "net", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
portable-pty = "0.9.0"
base64 = "0.23.1"
sha2 = "0.11.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
