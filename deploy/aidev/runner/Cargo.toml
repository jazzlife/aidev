[package]
name = "aidev-runner"
version = "0.13.5"
edition = "2021"
# wide 1.x (SIMD for the built-in H.264 encoder, via openh264 0.9.8) needs Rust 1.89; tray-icon 0.26 needs 1.90
rust-version = "1.90"
description = "Nado AI Dev remote runner: connects a developer PC to the platform (outbound only) to run, sync, preview, show and debug code"
license = "UNLICENSED"
publish = false

[[bin]]
name = "aidev-runner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "signal", "io-util", "net", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
portable-pty = "0.9.0"
base64 = "0.23.1"
sha2 = "0.11.0"
enigo = "0.6"
openh264 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9"
# status icon (menu bar / notification area) and the event loop it needs on the main thread
tray-icon = { version = "0.26", default-features = false }
tao = { version = "0.37", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# status icon over D-Bus StatusNotifierItem (KDE, XFCE, GNOME with the AppIndicator extension …): tray-icon's KSNI
# backend — pure Rust, its own thread, no GTK and no event loop
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
